<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Kunjungan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="brand">Bunaken Marine Park</div>
        <nav class="site-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="struktur.html">Profil & Organisasi</a></li>
                <li><a href="registration.html" class="active">Registration</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="form-container">
            <h2>Pesan Kunjungan</h2>
            <form action="#" method="post">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="contoh@email.com" required>

                <label for="tgl">Tanggal Kunjungan</label>
                <input type="date" id="tgl" name="tgl" required>

                <label for="jml">Jumlah Orang</label>
                <input type="number" id="jml" name="jml" min="1" max="20" placeholder="1-20 orang" required>

                <label for="paket">Pilihan Paket</label>
                <select id="paket" name="paket">
                    <option value="snorkeling">Snorkeling Package</option>
                    <option value="diving">Diving Exploration</option>
                    <option value="tour">Island & Sunset Tour</option>
                </select>

                <label for="catatan">Catatan Tambahan</label>
                <textarea id="catatan" name="catatan" rows="4" placeholder="Permintaan khusus atau informasi tambahan..."></textarea>

                <button type="submit" class="btn">Kirim Pesanan</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Kelas Web Design - Taman Nasional Bunaken</p>
    </footer>
</body>
</html>
